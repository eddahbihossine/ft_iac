version: '3.8'

services:
  e2e:
    image: mcr.microsoft.com/playwright:latest
    container_name: playwright_e2e
    # Run as current user so mounted files keep correct ownership
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/work
    working_dir: /work
    # Join the same network defined in docker-compose.yml so the test runner
    # can access the API and DB by their service names.
    networks:
      - app_network
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    # Keep the container running; the healthcheck will actually run the tests.
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: "no"
    environment:
      # When using the compose network the API service is reachable by its
      # container name `nest_api` on port 3000. Tests default to localhost,
      # so override TEST_HOST when running in-compose if needed.
      TEST_HOST: "http://nest_api:3000"
      TEST_USERNAME: "toto"
    healthcheck:
      # The healthcheck runs the full Playwright test suite once. If it exits
      # with success the service becomes healthy. Logs are available via
      # `docker compose logs e2e` for debugging.
      test: ["CMD-SHELL", "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm exec playwright install && pnpm test:e2e"]
      interval: 1m
      timeout: 10m
      retries: 1
      start_period: 5s

networks:
  app_network:
    external: true
